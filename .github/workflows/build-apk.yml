name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android-apk:
    name: Build Full 36MB Android APK (Pelican Campus Quest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17 for Android SDK Compiler (aapt2 / d8 / apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download All 16 3D GLB Models & Compile Signed 36MB Android APK
        run: |
          node tools/download-assets.mjs
          ls -lh Pelican-Campus-Quest.apk releases/Pelican-Campus-Quest.apk

      - name: Commit Built 36MB APK to Repository Releases Folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Pelican-Campus-Quest.apk releases/Pelican-Campus-Quest.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish full 36MB signed Pelican-Campus-Quest.apk [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Upload 36MB APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pelican-Campus-Quest-APK
          path: Pelican-Campus-Quest.apk
          if-no-files-found: error

      - name: Publish Full 36MB APK to GitHub Releases (v1.0.0 Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 ./Pelican-Campus-Quest.apk --clobber
            gh release edit v1.0.0 --title "Pelican Campus Quest v2.0.0 — Full 36MB Android APK" --notes "Full 36.4 MB offline 3D Open-World Game APK with all 16 3D GLB models, Three.js engine, soundtrack, and mobile touch controls. Tap **Pelican-Campus-Quest.apk** under Assets to download."
          else
            gh release create v1.0.0 ./Pelican-Campus-Quest.apk \
              --title "Pelican Campus Quest v2.0.0 — Full 36MB Android APK" \
              --notes "Full 36.4 MB offline 3D Open-World Game APK with all 16 3D GLB models, Three.js engine, soundtrack, and mobile touch controls. Tap **Pelican-Campus-Quest.apk** under Assets to download." \
              --latest
          fi
