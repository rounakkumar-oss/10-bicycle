name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android-apk:
    name: Build Pelican Campus Quest Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package Android APK (Pelican-Campus-Quest.apk)
        run: |
          node tools/ci-build-apk.mjs
          ls -lh Pelican-Campus-Quest.apk releases/Pelican-Campus-Quest.apk

      - name: Commit APK to Repository Releases Folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Pelican-Campus-Quest.apk releases/Pelican-Campus-Quest.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish built Pelican-Campus-Quest.apk [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pelican-Campus-Quest-APK
          path: Pelican-Campus-Quest.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (v1.0.0 Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 ./Pelican-Campus-Quest.apk --clobber
          else
            gh release create v1.0.0 ./Pelican-Campus-Quest.apk \
              --title "Pelican Campus Quest v1.0.0 — Android APK" \
              --notes "Click **Pelican-Campus-Quest.apk** below under Assets to download the Android APK directly on mobile." \
              --latest
          fi
